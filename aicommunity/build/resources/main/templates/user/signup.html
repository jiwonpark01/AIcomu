<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>회원가입 — AI Community</title>
    <link rel="stylesheet" th:href="@{/css/style.css}"/>
</head>
<body>
<div class="stars"></div>

<nav class="navbar">
    <a class="navbar-brand" th:href="@{/posts}">AI<span>Community</span></a>
    <div class="navbar-nav">
        <a th:href="@{/login}">로그인</a>
    </div>
</nav>

<div class="auth-wrap">
    <div class="auth-card">
        <h1 class="auth-title">회원가입</h1>
        <p class="auth-subtitle">AI 커뮤니티에 함께하세요.</p>

        <form class="auth-form" th:action="@{/signup}" th:object="${signupRequest}" method="post">

            <div class="form-group">
                <label class="form-label">아이디</label>
                <input type="text" th:field="*{username}" class="form-control" placeholder="3~50자"/>
                <div th:if="${#fields.hasErrors('username')}" class="form-error" th:errors="*{username}"></div>
            </div>

            <div class="form-group">
                <label class="form-label">비밀번호</label>
                <input type="password" th:field="*{password}" class="form-control" placeholder="4자 이상"/>
                <div th:if="${#fields.hasErrors('password')}" class="form-error" th:errors="*{password}"></div>
            </div>

            <div class="form-group">
                <label class="form-label">닉네임</label>
                <input type="text" th:field="*{nickname}" class="form-control" placeholder="화면에 표시될 이름"/>
                <div th:if="${#fields.hasErrors('nickname')}" class="form-error" th:errors="*{nickname}"></div>
            </div>

            <button type="submit" class="btn btn-primary btn-full">가입하기</button>
        </form>

        <div class="auth-footer">
            이미 계정이 있으신가요? <a th:href="@{/login}">로그인</a>
        </div>
    </div>
</div>
</body>
</html>
