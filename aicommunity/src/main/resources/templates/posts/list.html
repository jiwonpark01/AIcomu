<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Community</title>
    <link rel="stylesheet" th:href="@{/css/style.css}"/>
</head>
<body>
<div class="stars"></div>

<nav class="navbar">
    <a class="navbar-brand" th:href="@{/posts}">AI<span>Community</span></a>
    <div class="navbar-nav">
        <span sec:authorize="isAuthenticated()" class="navbar-user" sec:authentication="name"></span>
        <a sec:authorize="isAuthenticated()" th:href="@{/posts/new}" class="btn btn-primary btn-sm">글쓰기</a>
        <form sec:authorize="isAuthenticated()" action="/logout" method="post" style="display:inline">
            <button type="submit">로그아웃</button>
        </form>
        <a sec:authorize="isAnonymous()" th:href="@{/login}">로그인</a>
        <a sec:authorize="isAnonymous()" th:href="@{/signup}">회원가입</a>
    </div>
</nav>

<main class="page">
    <div class="container">

        <section class="hero">
            <span class="hero-label">AI COMMUNITY</span>
            <h1>AI 지식과 최신 동향을<br/>함께 나눠요.</h1>
            <p>지식 공유, 트렌드, 그리고 질문과 답변까지 — 모든 AI 이야기가 이곳에 모입니다.</p>
        </section>

        <div class="filter-bar">
            <a href="/posts" class="filter-tag active">전체</a>
            <a href="/posts?category=KNOWLEDGE" class="filter-tag">KNOWLEDGE</a>
            <a href="/posts?category=TREND"     class="filter-tag">TREND</a>
            <a href="/posts?category=QNA"       class="filter-tag">QNA</a>
        </div>

        <div class="section-header">
            <h2>게시글</h2>
            <span class="count" th:text="'· ' + ${#lists.size(posts)} + '개'"></span>
        </div>

        <div class="post-grid">
            <div th:if="${#lists.isEmpty(posts)}" class="empty-state">
                <div class="empty-state-icon">✦</div>
                <p>아직 등록된 게시글이 없습니다.<br/>첫 번째 글을 작성해보세요!</p>
            </div>

            <a th:each="post : ${posts}"
               th:href="@{/posts/{id}(id=${post.id})}"
               class="post-card">
                <div class="post-card-top">
                    <span class="badge"
                          th:classappend="'badge-' + ${post.category}"
                          th:text="${post.category}"></span>
                    <span class="post-card-date"
                          th:text="${#temporals.format(post.createdAt, 'yyyy.MM.dd')}"></span>
                </div>
                <div class="post-card-title" th:text="${post.title}"></div>
                <div class="post-card-excerpt" th:text="${post.content}"></div>
                <div class="post-card-foot">
                    <span class="avatar"
                          th:text="${#strings.substring(post.authorNickname, 0, 1)}"></span>
                    <span th:text="${post.authorNickname}"></span>
                </div>
            </a>
        </div>

    </div>
</main>
</body>
</html>
