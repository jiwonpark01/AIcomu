<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>게시글 수정 — AI Community</title>
    <link rel="stylesheet" th:href="@{/css/style.css}"/>
</head>
<body>
<div class="stars"></div>

<nav class="navbar">
    <a class="navbar-brand" th:href="@{/posts}">AI<span>Community</span></a>
</nav>

<main class="page">
    <div class="container container--read">
        <a th:href="@{/posts/{id}(id=${postId})}" class="back-link">← 돌아가기</a>
        <h1 class="page-heading">게시글 수정</h1>

        <div class="card">
            <form th:action="@{/posts/{id}/edit(id=${postId})}"
                  th:object="${postUpdateRequest}" method="post">

                <div class="form-group">
                    <label class="form-label">카테고리</label>
                    <select th:field="*{category}" class="form-control">
                        <option th:each="cat : ${categories}" th:value="${cat}" th:text="${cat}"></option>
                    </select>
                    <div th:if="${#fields.hasErrors('category')}" class="form-error" th:errors="*{category}"></div>
                </div>

                <div class="form-group">
                    <label class="form-label">제목</label>
                    <input type="text" th:field="*{title}" class="form-control"/>
                    <div th:if="${#fields.hasErrors('title')}" class="form-error" th:errors="*{title}"></div>
                </div>

                <div class="form-group">
                    <label class="form-label">내용</label>
                    <textarea th:field="*{content}" class="form-control"></textarea>
                    <div th:if="${#fields.hasErrors('content')}" class="form-error" th:errors="*{content}"></div>
                </div>

                <div class="form-actions">
                    <button type="submit" class="btn btn-primary">수정 완료</button>
                    <a th:href="@{/posts/{id}(id=${postId})}" class="btn btn-secondary">취소</a>
                </div>
            </form>
        </div>
    </div>
</main>
</body>
</html>
