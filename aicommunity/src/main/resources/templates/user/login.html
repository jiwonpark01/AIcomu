<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>로그인 — AI Community</title>
    <link rel="stylesheet" th:href="@{/css/style.css}"/>
</head>
<body>
<div class="stars"></div>

<nav class="navbar">
    <a class="navbar-brand" th:href="@{/posts}">AI<span>Community</span></a>
    <div class="navbar-nav">
        <a th:href="@{/signup}">회원가입</a>
    </div>
</nav>

<div class="auth-wrap">
    <div class="auth-card">
        <h1 class="auth-title">로그인</h1>
        <p class="auth-subtitle">다시 오신 걸 환영해요. 계속하려면 로그인하세요.</p>

        <div th:if="${param.error}" class="alert alert-error">
            아이디 또는 비밀번호가 올바르지 않습니다
        </div>

        <form class="auth-form" action="/login" method="post">

            <div class="form-group">
                <label class="form-label">아이디</label>
                <input type="text" name="username" class="form-control" placeholder="아이디 입력" autofocus/>
            </div>

            <div class="form-group">
                <label class="form-label">비밀번호</label>
                <input type="password" name="password" class="form-control" placeholder="비밀번호 입력"/>
            </div>

            <button type="submit" class="btn btn-primary btn-full">로그인</button>
        </form>

        <div class="auth-footer">
            계정이 없으신가요? <a th:href="@{/signup}">회원가입</a>
        </div>
    </div>
</div>
</body>
</html>
